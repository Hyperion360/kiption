name: tests
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']   # ceiling parity with official eFiction 3.5.7's tested range
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@9e72090525849c5e82e596048e0ed7ba31b135cc # v2.32.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
      - uses: ramsey/composer-install@a2636af0004d1c0499ffca6ac972ef1fa35d38fe # v3.1.0
      - run: vendor/bin/phpunit
